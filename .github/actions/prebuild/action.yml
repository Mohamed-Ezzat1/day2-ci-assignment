name: prebuild composite
description: Prebuild action for the temperature app
inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.11'
  sonar-token:
    description: 'SonarQube token'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run tests
      shell: bash
      run: |
        pytest -v --junitxml=reports/junit.xml
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
    - name: lint
      shell: bash
      run: |
        pylint temperature
    - name: type check
      shell: bash
      run: |
        mypy temperature
    - name: pytest coverage
      shell: bash
      run: |
        pytest --cov=temperature --cov-report=xml  
    - name: sonar coverage
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        args: >
          -Dsonar.coverage.jacoco.xmlReportPaths=coverage.xml
    - name: docker install
      uses: docker/setup-buildx-action@v3
    - name: build docker image
      uses: docker/build-push-action@v5
      with:
        context: .  
        tags: temperature:latest
        load: true
    - name: save docker image
      shell: bash
      run: 
        docker save temperature:latest -o temperature.tar
    - name: upload docker image
      uses: actions/upload-artifact@v7
      with:
        name: temperature-docker-image
        path: temperature.tar